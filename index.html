<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Event Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadData()">

    <header>
        <div class="header-row">
            <div>
                <h1>Elite Event Planner</h1>
                <p class="quote">"Plan with elegance, celebrate with style."</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
        </div>
    </header>

    <!-- Event Templates -->
    <section>
        <h2>Event Templates</h2>
        <button onclick="applyTemplate('wedding')">Wedding</button>
        <button onclick="applyTemplate('birthday')">Birthday</button>
        <button onclick="applyTemplate('corporate')">Corporate</button>
    </section>

    <!-- Guest List -->
    <section>
        <h2>Guest List</h2>
        <label for="guestName">Guest name</label>
        <input id="guestName" placeholder="Guest name">
        <button onclick="addGuest()">Add</button>
        <ul id="guestList"></ul>
        <p>Total Guests: <span id="guestCount">0</span></p>
    </section>

    <!-- Budget -->
    <section>
        <h2>Budget</h2>
        <label for="budgetInput">Total budget</label>
        <input id="budgetInput" type="number" placeholder="Total budget">
        <button onclick="setBudget()">Set Budget</button>
        <p>Remaining: $<span id="remainingBudget">0</span></p>

        <div id="budgetBarContainer">
            <div id="budgetBar"></div>
        </div>

        <label for="categoryName">Category name</label>
        <input id="categoryName" placeholder="Category (e.g. Food)">
        <label for="categoryCost">Category cost</label>
        <input id="categoryCost" type="number" placeholder="Cost">
        <button onclick="addCategory()">Add Category</button>
        <ul id="categoryList"></ul>
        <p id="chartEmpty" class="muted">No data yet.</p>
        <canvas id="categoryChart" width="400" height="200"></canvas>
    </section>

    <!-- Tasks -->
    <section>
        <h2>Tasks</h2>
        <label for="taskInput">Task name</label>
        <input id="taskInput" placeholder="Task name">
        <button onclick="addTask()">Add Task</button>
        <ul id="taskList"></ul>
        <p id="timeEstimate" class="muted">Estimated time: 0 hours</p>
    </section>

    <!-- Suggestions -->
    <section>
        <h2>Suggestions</h2>
        <p id="suggestionText">No suggestions yet.</p>
    </section>

    <!-- Export -->
    <section>
        <h2>Export Plan</h2>
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="exportPDF()">Export PDF</button>
        <button class="danger" onclick="clearAll()">Clear All</button>
    </section>

    <p id="statusMessage" class="status" aria-live="polite"></p>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
